name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src/ tests/

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: python -m mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --cov=src/amortize --cov-report=term-missing --cov-fail-under=90

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: amortize:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: amortize:latest
          load: true
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: amortize:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.8.5'
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init
      - run: terraform -chdir=infra validate

  apply-and-deploy:
    name: Terraform Apply and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [terraform-validate, trivy-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.8.5'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: amortize:latest
          load: true
          cache-from: type=gha
      - uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0
      - run: |
          mkdir -p ~/.local/bin
          curl -sL https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64 -o ~/.local/bin/kind
          chmod +x ~/.local/bin/kind
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: |
          # Apply Terraform to provision kind cluster
          cd infra && terraform init && terraform apply -auto-approve
          KUBECONFIG_PATH=$(cat terraform.tfstate | jq -r '.outputs.kubeconfig_path.value')
          echo "Kubeconfig created at: $KUBECONFIG_PATH"
          ls -lh "$KUBECONFIG_PATH"
          # Export kubeconfig path for subsequent steps
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> $GITHUB_ENV
      - run: |
          # Load docker image into kind cluster
          kind load docker-image amortize:latest --name amortize-poc
      - run: |
          # Deploy to cluster
          kubectl kustomize k8s/base | kubectl apply -f -
          kubectl rollout status deployment/amortize -n amortize --timeout=5m

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [apply-and-deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.8.5'
      - uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0
      - run: |
          # Extract kubeconfig path from Terraform state
          cd infra && terraform init
          KUBECONFIG=$(cat terraform.tfstate | jq -r '.outputs.kubeconfig_path.value')
          echo "KUBECONFIG=$KUBECONFIG" >> $GITHUB_ENV
      - run: |
          echo "Cluster info:"
          kubectl cluster-info
          echo "Pods:"
          kubectl get pods -n amortize
          echo "Port-forwarding service..."
          kubectl port-forward -n amortize svc/amortize 8000:8000 > /dev/null 2>&1 &
          sleep 3
      - run: python tests/smoke_test.py
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: smoke-test-response
          path: /tmp/smoke-test-response.json
          retention-days: 7

  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [smoke-test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.8.5'
      - run: cd infra && terraform init && terraform destroy -auto-approve

  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/mir-quadri/amortize-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
