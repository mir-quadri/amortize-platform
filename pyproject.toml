[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amortize-platform"
version = "0.1.0"
description = "POC: Amortization calculator with Python, Docker, K8s, Terraform"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "httpx==0.27.0",
    "ruff==0.7.4",
    "mypy==1.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/amortize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/amortize --cov-report=term-missing --cov-fail-under=90"
